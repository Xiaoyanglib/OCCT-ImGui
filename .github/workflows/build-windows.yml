name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install OCCT
      shell: pwsh
      run: |
        $url = "https://github.com/Open-Cascade-SAS/OCCT/releases/download/V8_0_0/opencascade-release-no-pch.zip"
        $zip = "C:/occt.zip"
        Invoke-WebRequest -Uri $url -OutFile $zip
        if (-not (Test-Path $zip)) { Write-Error "Download failed"; exit 1 }
        $size = (Get-Item $zip).Length
        Write-Host "Downloaded: $size bytes"
        if ($size -lt 1000) { Write-Error "File too small, likely redirect page"; Get-Content $zip; exit 1 }
        Expand-Archive -Path $zip -DestinationPath C:/occt_outer -Force
        Expand-Archive -Path C:/occt_outer/opencascade-8.0.0-vc14-64.zip -DestinationPath C:/occt -Force
        $cfg = Get-ChildItem -Path C:/occt -Recurse -Filter "OpenCASCADEConfig.cmake" | Select-Object -First 1
        if ($cfg) {
          $dir = $cfg.DirectoryName
          Write-Host "Found config: $dir"
          echo "OpenCASCADE_DIR=$dir" >> $env:GITHUB_ENV
        } else {
          Write-Error "OpenCASCADEConfig.cmake not found in extracted files"
          Get-ChildItem C:/occt -Recurse -Depth 2
          exit 1
        }

    - name: Configure
      run: cmake -B build -S . -DOpenCASCADE_DIR="$env:OpenCASCADE_DIR"

    - name: Build
      run: cmake --build build
